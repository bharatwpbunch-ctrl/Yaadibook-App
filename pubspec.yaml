name: yaadibook
description: "Yaadibook - Simple mobile business management assistant for service businesses"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.8.4
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  permission_handler: ^12.0.1
  flutter_contacts: ^2.1.0
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  drift: ^2.35.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  csv: ^8.0.0
  share_plus: ^12.0.2
  in_app_purchase: ^3.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
